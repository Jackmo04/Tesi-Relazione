apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: "detect-etc-write"
spec:
  kprobes:
  - call: "security_file_permission"
    syscall: false
    return: true
    args:
    - index: 0
      type: "file"
    - index: 1
      type: "int"
    returnArg:
      index: 0
      type: "int"
    selectors:
    - matchArgs:      
      - index: 0
        operator: "Prefix"
        values:
        - "/etc/"
      - index: 1
        operator: "Equal"
        values:
        - "2" # MAY_WRITE: 0x02