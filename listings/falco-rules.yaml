- rule: Interactive Shell in Container
  desc: Detect an interactive shell started inside a container
  condition: >
    spawned_process
    and container
    and proc.name in (bash, sh, dash)
    and proc.tty != 0
  output: >
    Interactive shell spawned in container
    (container=%container.name proc_exe=%proc.exe command=%proc.cmdline ...)
  priority: NOTICE
  tags: [container, shell, execution]
##################################################################################
- rule: Write Below Sensitive Directory
  desc: Detect a write operation below a sensitive path
  condition: >
    open_write
    and container
    and fd.name startswith /etc/
  output: >
    File opened for writing below a sensitive directory
    (container=%container.name proc_exe=%proc.exe command=%proc.cmdline ...)
  priority: WARNING
  tags: [container, filesystem]
##################################################################################
- rule: Drop and execute new binary in container
  desc: > 
    Detect if an executable not belonging to the base image of a container is being executed.
  condition: >
    spawned_process
    and container
    and proc.is_exe_upper_layer=true
  output: > 
    Executing binary not part of base image
    (container=%container.name proc_exe=%proc.exe command=%proc.cmdline ...)
  priority: CRITICAL
  tags: [container, process, mitre_persistence, TA0003]